<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #212529;
      min-height: 100vh;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
    }

    /* Evita el auto-zoom molesto de iOS/Android al tocar un input */
    .form-control {
      font-size: 16px;
    }

    @media (max-width: 575.98px) {
      .login-card {
        padding: 1.75rem !important;
      }
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="card login-card bg-white p-4 p-md-5 rounded-4 shadow-lg border-0">
    <div class="text-center mb-4">
      <div class="fs-1 mb-1">🔐</div>
      <h3 class="fw-bold fs-4 m-0">Acceso Admin</h3>
      <small class="text-muted">Ingresa tus credenciales para continuar</small>
    </div>

    <!-- Bloque para alertas de credenciales incorrectas (si usas flash de Flask) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
      <div class="mb-3">
        <label class="form-label text-muted small fw-bold">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="usuario" class="form-control" required placeholder="Tu usuario" autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small fw-bold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" name="clave" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Entrar al Panel</button>
    </form>

    <hr class="my-4 opacity-25">

    <a href="/" class="btn btn-link w-100 text-muted text-decoration-none small text-center">
      <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
