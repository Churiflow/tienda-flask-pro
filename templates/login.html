<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - TiendaMaster</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card login-card bg-white p-4 p-md-5 shadow-lg border-0">
        <!-- Encabezado -->
        <div class="text-center mb-4">
            <div class="fs-1 text-primary mb-2">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Acceso Admin</h3>
            <p class="text-muted small">Ingresa tus credenciales para administrar el sistema</p>
        </div>

        <!-- Mensajes Flash de Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show small py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Formulario de Login -->
        <form action="/login" method="POST" id="loginForm">
            <div class="mb-3">
                <label for="usuario" class="form-label text-muted small fw-bold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej: admin" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="clave" class="form-label text-muted small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" id="clave" name="clave" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3" id="btnSubmit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>

        <hr class="my-3 opacity-25">

        <div class="text-center">
            <a href="/" class="text-decoration-none text-muted small fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <!-- Script de Interacción -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Alternar visibilidad de contraseña
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('clave');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });

        // Estado de carga en envío del formulario
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function () {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Validando...';
        });
    </script>
</body>

</html>
